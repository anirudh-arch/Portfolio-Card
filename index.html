<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <img src="https://ui-avatars.com/api/?name=Makam+Anirudh&background=007bff&color=fff" alt="Profile Photo" class="profile-img">
            <h2>Makam Anirudh</h2>
            <p class="subtitle">Computer Science & Engineering | Backend Focus</p>
        </div>
        
        <div class="card-body">
            <p class="bio">Building scalable systems and exploring AI engineering.</p>
            
            <strong>Technical Skills</strong>
            <div class="skills-container">
                <span class="skill-tag">Python (FastAPI)</span>
                <span class="skill-tag">Java</span>
                <span class="skill-tag">SQL</span>
                <span class="skill-tag">HTML/CSS</span>
            </div>

            <strong>Featured Project</strong>
            <div class="project-box">
                <p><strong>WhatsApp Notifier:</strong> A full-stack web application with a FastAPI backend and deployed on Vercel.</p>
            </div>
        </div>

        <div class="card-footer">
            <a href="https://github.com/anirudh-arch" target="_blank" rel="noopener noreferrer" class="btn">GitHub</a>
            <button id="theme-btn" class="btn outline">Toggle Theme</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
